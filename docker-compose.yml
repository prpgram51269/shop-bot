services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shop_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: